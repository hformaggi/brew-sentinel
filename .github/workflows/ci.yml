name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - name: Check release version
        run: |
          go build -ldflags='-X main.version=0.1.0' -o bin/brew-sentinel ./cmd/brew-sentinel
          test "$(./bin/brew-sentinel --version)" = 'brew-sentinel 0.1.0'
